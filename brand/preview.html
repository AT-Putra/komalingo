<!doctype html>
<html><head><meta charset="utf-8"><title>Komalingo logo</title>
<style>
  body { margin:0; font-family:"Segoe UI",sans-serif; color:#0f172a; background:#fff; }
  section { padding:28px 36px; border-bottom:1px solid #e2e8f0; }
  h2 { margin:0 0 16px; font-size:15px; font-weight:600; color:#64748b; }
  .dark { background:#0f172a; }
  .row { display:flex; align-items:end; gap:22px; flex-wrap:wrap; }
  .bar { display:flex; align-items:center; gap:22px; padding:14px 22px; border-radius:12px; }
  .bar.l { background:#f3f3f3; } .bar.d { background:#202020; }
  .bar span { font-size:12px; color:#888; width:74px; }
</style></head><body>
<section><h2>Lockup</h2><img src="komalingo-lockup.svg" height="120"></section>
<section class="dark"><h2>Lockup on dark</h2><img src="komalingo-lockup-on-dark.svg" height="120"></section>
<section><h2>App icon (light tile · dark tile) at 256 · 64 · 48 · 32 · 24 · 16</h2>
  <div class="row" id="icons"></div></section>
<section><h2>On Windows taskbars</h2><div id="bars" style="display:grid;gap:12px"></div></section>
<script>
const sizes = [256, 64, 48, 32, 24, 16];
const icons = document.getElementById("icons");
for (const f of ["komalingo-icon.svg", "komalingo-icon-dark.svg"])
  for (const s of sizes) icons.insertAdjacentHTML("beforeend", `<img src="${f}" width="${s}" height="${s}">`);
const bars = document.getElementById("bars");
for (const [cls, label] of [["l", "light taskbar"], ["d", "dark taskbar"]])
  bars.insertAdjacentHTML("beforeend", `<div class="bar ${cls}"><span>${label}</span>
    ${["komalingo-icon.svg", "komalingo-icon-dark.svg", "komalingo-mark.svg", "komalingo-mark-on-dark.svg"]
      .map(f => `<img src="${f}" width="24" height="24"><img src="${f}" width="32" height="32">`).join("")}</div>`);
</script>
</body></html>

[project]
name = "manga-translator-sidecar"
version = "0.1.0"
description = "FastAPI sidecar: detect -> OCR -> translate -> inpaint -> render -> encode -> write"
requires-python = ">=3.11,<3.14"

# The pinned stack from the build order: opencv-python 5.x / torch 2.14 / numpy 2.x.
dependencies = [
    "numpy>=2.0,<3",
    "opencv-python>=5.0,<6",
    "torch>=2.14,<3",
    "pillow>=11",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "psutil>=6",
    "manga-ocr>=0.1.14",
    "onnxruntime>=1.20,<2",
    "py7zr>=1.0",
    "libarchive-c>=5.1",
    # Phase 7 (AC-5): pypdfium2 reads and renders, pypdf carries the outline
    # and /Info across, img2pdf rebuilds without re-encoding a single page.
    # PyMuPDF is AGPL and is not an option (spec, hard constraint 2).
    "pypdfium2>=5,<6",
    "pypdf>=6,<7",
    "img2pdf>=0.6,<0.7",
]

# comic-text-detector (dep #5) and manga-image-translator (dep #2) are NOT on
# PyPI and are absent here deliberately. That is a Phase 0a finding, not an
# omission: spikes/imports.py reports both as FAILED, which is exactly the
# observable that selects the Section C row 2 / row 5 fallback in writing.
# See progress.txt.

[tool.uv]
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.2",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

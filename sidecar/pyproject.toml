[project]
name = "komalingo-sidecar"
version = "0.1.0"
description = "FastAPI sidecar: detect -> OCR -> translate -> inpaint -> render -> encode -> write"
license = "MIT"
requires-python = ">=3.11,<3.14"

# The pinned stack from the build order: opencv-python 5.x / torch 2.14 / numpy 2.x.
dependencies = [
    "numpy>=2.0,<3",
    "opencv-python>=5.0,<6",
    "torch>=2.14,<3",
    "pillow>=11",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "psutil>=6",
    "manga-ocr>=0.1.14",
    # The GPU package carries the CPU provider too, so one build serves both
    # paths: models.select_provider picks CUDA when torch sees a device and
    # falls back to CPU, with a reason, when it does not. Built against CUDA
    # 13 since 1.27, which is what the torch index below ships.
    "onnxruntime-gpu>=1.27,<2",
    "py7zr>=1.0",
    "libarchive-c>=5.1",
    # Phase 7 (AC-5): pypdfium2 reads and renders, pypdf carries the outline
    # and /Info across, img2pdf rebuilds without re-encoding a single page.
    # PyMuPDF is AGPL and is not an option (spec, hard constraint 2).
    "pypdfium2>=5,<6",
    "pypdf>=6,<7",
    "img2pdf>=0.6,<0.7",
]

# comic-text-detector (dep #5) and manga-image-translator (dep #2) are NOT on
# PyPI and are absent here deliberately. That is a Phase 0a finding, not an
# omission: spikes/imports.py reports both as FAILED, which is exactly the
# observable that selects the Section C row 2 / row 5 fallback in writing.
# See progress.txt.

[tool.uv]
# CUDA 13 torch: the RTX 5070 Ti (Blackwell, sm_120) needs CUDA >= 12.8, and
# 2.14's Windows wheels come as cu126 or cu130. The wheel runs on a machine
# with no GPU at all -- torch.cuda.is_available() is simply False and every
# check takes the CPU path -- so this is one build, not two; the cost is
# size, about 3 GB of CUDA libraries in torch/lib that the exe carries.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

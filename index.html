<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/komalingo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Komalingo</title>
    <script>
      // Before first paint, so the window does not flash the other theme.
      // App.tsx owns this afterwards and keeps it in sync with the toggle.
      (function () {
        var t = "system";
        try { t = localStorage.getItem("mt.theme") || "system"; } catch (e) {}
        if (t === "system") {
          t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <meta name="color-scheme" content="dark light" />
    <style>
      /* The splash. Inline and JS-free on purpose: App.css arrives with the
         module graph, and until then a styled page needs its style HERE.
         Colours mirror App.css's --bg / --fg / --accent for both themes so
         the hand-off to the shell is a fade, not a jump. main.tsx removes
         #splash after React's first commit. */
      html, body { height: 100%; margin: 0; }
      html { background: #0f172a; }
      html[data-theme="light"] { background: #f4f6fa; }
      #splash {
        position: fixed; inset: 0; z-index: 100;
        display: grid; place-items: center; align-content: center; gap: 14px;
        background: #0f172a; color: #94a3b8;
        font: 15px/1.5 "Segoe UI Variable Text", "Segoe UI", Inter, system-ui, sans-serif;
        transition: opacity 250ms ease-out;
      }
      html[data-theme="light"] #splash { background: #f4f6fa; color: #526176; }
      #splash.out { opacity: 0; pointer-events: none; }
      .splash-mark {
        display: grid; place-items: center; width: 56px; height: 56px;
        color: #f1f5f9;
        animation: splash-breathe 1.6s ease-in-out infinite;
      }
      html[data-theme="light"] .splash-mark { color: #0f172a; }
      .splash-name { font-weight: 600; letter-spacing: -0.01em; color: #f1f5f9; }
      html[data-theme="light"] .splash-name { color: #0f172a; }
      .splash-bar {
        position: relative; width: 160px; height: 3px; border-radius: 999px;
        background: rgba(148, 163, 184, 0.25); overflow: hidden;
      }
      .splash-bar span {
        position: absolute; top: 0; bottom: 0; left: -40%; width: 40%;
        border-radius: inherit; background: #22c55e;
        animation: splash-sweep 1.4s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      }
      html[data-theme="light"] .splash-bar span { background: #16a34a; }
      .splash-text { font-size: 0.85rem; }
      .splash-error {
        max-width: 560px; margin: 6px 24px 0; padding: 12px 14px;
        border-radius: 10px; background: rgba(239, 68, 68, 0.12); color: #f87171;
        font: 0.85rem/1.5 "Cascadia Code", Consolas, monospace; white-space: pre-wrap;
      }
      html[data-theme="light"] .splash-error { color: #b91c1c; }
      @keyframes splash-sweep { to { left: 100%; } }
      @keyframes splash-breathe { 50% { transform: scale(1.06); } }
      @media (prefers-reduced-motion: reduce) {
        .splash-mark, .splash-bar span { animation: none; }
        .splash-bar span { left: 0; width: 100%; opacity: 0.6; }
        #splash { transition: none; }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <div id="splash" role="status" aria-busy="true" aria-live="polite">
      <div class="splash-mark" aria-hidden="true">
        <!-- brand/komalingo-mark.svg; the left half follows the theme via currentColor -->
        <svg width="56" height="56" viewBox="0 0 512 512">
          <defs>
            <mask id="splash-g" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
              <rect width="512" height="512" fill="#fff" />
              <line x1="306" y1="-10" x2="206" y2="522" stroke="#000" stroke-width="30" />
            </mask>
            <clipPath id="splash-l"><polygon points="0,0 304,0 208,512 0,512" /></clipPath>
            <clipPath id="splash-r"><polygon points="304,0 512,0 512,512 208,512" /></clipPath>
          </defs>
          <g mask="url(#splash-g)">
            <g clip-path="url(#splash-l)" fill="currentColor"><ellipse cx="262" cy="232" rx="206" ry="176" /><path d="M128 350 L78 474 L240 396 Z" /></g>
            <g clip-path="url(#splash-r)" fill="#E8452C"><ellipse cx="262" cy="232" rx="206" ry="176" /><path d="M128 350 L78 474 L240 396 Z" /></g>
          </g>
        </svg>
      </div>
      <div class="splash-name">Komalingo</div>
      <div class="splash-bar" aria-hidden="true"><span></span></div>
      <div class="splash-text">Starting…</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
